# Development Profile
spring.application.name=healthcare
spring.datasource.url=jdbc:mysql://localhost:3306/HealthPal?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.example.healthcare=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# External APIs (disabled for dev)
translation.api.enabled=false
health.alerts.api.enabled=false

# Server
server.port=8080

