spring.application.name=healthcare
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Default configuration (overridden by profile-specific files)
spring.datasource.url=jdbc:mysql://localhost:3306/HealthPal?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# External API Configuration
translation.api.enabled=false
translation.api.url=
translation.api.key=
health.alerts.api.enabled=false
health.alerts.api.url=

# JWT Configuration
jwt.secret=your-secret-key-change-in-production
jwt.expiration=86400000

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.show-actuator=false
springdoc.group-configs[0].group=healthpal
springdoc.group-configs[0].paths-to-match=/api/**

