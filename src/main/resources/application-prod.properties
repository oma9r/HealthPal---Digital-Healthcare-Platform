# Production Profile
spring.application.name=healthcare
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/HealthPal?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Connection Pooling
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Logging
logging.level.org.example.healthcare=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.file.name=logs/healthcare-prod.log

# External APIs
translation.api.enabled=${TRANSLATION_API_ENABLED:true}
translation.api.url=${TRANSLATION_API_URL:}
translation.api.key=${TRANSLATION_API_KEY:}
health.alerts.api.enabled=${HEALTH_ALERTS_API_ENABLED:true}
health.alerts.api.url=${HEALTH_ALERTS_API_URL:}

# Server
server.port=${PORT:8080}

# Security
jwt.secret=${JWT_SECRET:your-secret-key-change-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

